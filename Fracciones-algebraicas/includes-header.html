    }
};

JXG.Options.text.useMathJax = true;
JXG.Options.point.showInfobox = false;

function show(divID) {
    var sol = document.getElementById("solucion-"+divID);
    var div = document.getElementById(divID);

    console.log(sol);
    sol.classList.toggle('collapse');

    console.log("texto: " + div.innerHTML);

//    if(div.innerHTML === "Solución"){
    if(!sol.classList.contains('collapse')){
        div.innerHTML = "Oculta solución";
    }else{
        div.innerHTML = "Solución";
    }

}

function execute (whichTerminal, cmd) {
    var sandbox = $('sandbox');
    var jsResult = $('jsResult');
    try {
    var textToBeExecuted = cmd+"("+$('#terminal' + whichTerminal).val()+")";
    var result;
    if (/Algebrite\.[a-z]/.test(textToBeExecuted) || /;[ \t]*$/.test(textToBeExecuted)) {
        result = eval(textToBeExecuted);
    }
    else {
        result = Algebrite.run(textToBeExecuted);
    }
    //alert(result);
    $('#output' + whichTerminal).val(result)
    }
    catch (err) {
    var errDesc = err;
    errorBox.update('<h4>Error!<\/h4><code>' + errDesc + '<\/code>' );
    errorBox.show();
    }
}
</script>
